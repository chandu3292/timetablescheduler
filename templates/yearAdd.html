{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
#id_courses {
    max-height: 400px;
    overflow-y: auto;
    border: 2px solid #ddd;
    border-radius: 5px;
    padding: 15px;
    background: #f8f9fa;
}

#id_courses ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

#id_courses li {
    margin-bottom: 10px;
}

#id_courses label {
    display: flex;
    align-items: center;
    cursor: pointer;
}

#id_courses input[type="checkbox"] {
    margin-right: 10px;
    cursor: pointer;
}
</style>

<form method="post">
  {% csrf_token %}
  <fieldset>
    <div class="tablink">
      <h1 id="defaultOpen">Add Year</h1>
      <a href="{% url 'yearEdit' %}">
        <h1 id="link_to_edit">Edit Year</h1>
      </a>
    </div>

    <div class="tabcontent" id="new">
      {{ form.as_p }}
      <input type="submit" value="Submit" class="submit">
    </div>
  </fieldset>
</form>

{% endblock %}
