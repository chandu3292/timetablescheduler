{% extends 'base.html' %}
{% block content %}
{% load static %}

<fieldset class="fieldset">
  <div class="tablink">
    <a href="{% url 'instructorAdd'%}">
      <h1 onclick="openPage('new')" id="defaultOpen">Add Instructor</h1>
    </a>
    <h1 onclick="openPage('edit')" id="link_to_edit">Edit Instructor</h1>
  </div>
  <div class="tabcontent" id="edit">
    <div style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px;">
      <label for="searchInstructor" style="font-weight: bold; margin-right: 10px; font-size: 16px;">🔍 Search Instructor:</label>
      <input type="text" 
             id="searchInstructor" 
             placeholder="Type instructor name or UID..." 
             style="padding: 10px 15px; border: 2px solid #ddd; border-radius: 4px; font-size: 14px; width: 400px; max-width: 100%;"
             onkeyup="searchInstructors()">
      <span id="searchResultCount" style="margin-left: 15px; color: #666; font-size: 14px;"></span>
    </div>
    
    <table class="editTable" id="instructorTable">
      <thead>
        <tr class="table-headers">
          <th>UID</th>
          <th>Name</th>
          <th>Timetable</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for inst in instructors %}
        <tr>
          <td>{{inst.uid}}</td>
          <td>{{inst.name}}</td>
          <td>
            <a href="{% url 'instructor_timetable' %}?instructor={{inst.id}}" 
               style="background: #4CAF50; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; display: inline-block; font-size: 14px; font-weight: 500;">
              View
            </a>
          </td>
          <td>
            <div style="display: flex; gap: 10px; justify-content: center;">
              <a href="{% url 'instructorUpdate' inst.id %}" 
                 style="background: #2196F3; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; display: inline-block; font-size: 14px; font-weight: 500;">
                ✏️ Edit
              </a>
              <form action="{% url 'deleteinstructor' inst.id %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <input type="submit" value="🗑️ Delete" class="cross" 
                       style="background: #f44336; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500;"
                       onclick="return confirm('Are you sure you want to delete {{ inst.name }}?');">
              </form>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</fieldset>

<script>
function searchInstructors() {
  var input = document.getElementById("searchInstructor");
  var filter = input.value.toUpperCase();
  var table = document.getElementById("instructorTable");
  var tbody = table.getElementsByTagName("tbody")[0];
  var tr = tbody.getElementsByTagName("tr");
  var visibleCount = 0;

  // Loop through all table rows
  for (var i = 0; i < tr.length; i++) {
    var tdUID = tr[i].getElementsByTagName("td")[0];
    var tdName = tr[i].getElementsByTagName("td")[1];
    
    if (tdUID && tdName) {
      var uidValue = tdUID.textContent || tdUID.innerText;
      var nameValue = tdName.textContent || tdName.innerText;
      
      // Check if either UID or Name matches the search
      if (uidValue.toUpperCase().indexOf(filter) > -1 || 
          nameValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
        visibleCount++;
      } else {
        tr[i].style.display = "none";
      }
    }
  }

  // Update result count
  var resultSpan = document.getElementById("searchResultCount");
  if (filter === "") {
    resultSpan.textContent = "";
  } else {
    resultSpan.textContent = "Showing " + visibleCount + " of " + tr.length + " instructors";
  }
}
</script>

{% endblock %}
