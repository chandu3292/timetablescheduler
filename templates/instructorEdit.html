{% extends 'base.html' %}
{% block content %}
{% load static %}


<div style="margin-bottom: 20px;">
  <a href="{% url 'instructor_timetable_select' %}" class="btn" style="background: #009688; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">
    📅 View Instructor Timetables
  </a>
</div>

<fieldset class="fieldset">
  <div class="tablink">
    <a href="{% url 'instructorAdd'%}">
      <h1 onclick="openPage('new')" id="defaultOpen">Add Instructor</h1>
    </a>
    <h1 onclick="openPage('edit')" id="link_to_edit">Edit Instructor</h1>
  </div>
  <div class="tabcontent" id="edit">
    <table class="editTable">
      <thead>
        <tr class="table-headers">
          <th>UID</th>
          <th>Name</th>
          <th>Timetable</th>
          <th class="empty"></th>
        </tr>
      </thead>

      <tbody>
        {% for inst in instructors %}
        <tr>
          <td>{{inst.uid}}</td>
          <td>{{inst.name}}</td>
          <td>
            <a href="{% url 'instructor_timetable' %}?instructor={{inst.id}}" 
               style="background: #4CAF50; color: white; padding: 5px 15px; text-decoration: none; border-radius: 3px; display: inline-block; font-size: 14px;">
              View
            </a>
          </td>
          <td class="empty">
            <form action="{% url 'deleteinstructor' inst.id %}" method="post">
              {% csrf_token %}
              <input type="submit" value="X" class="cross">
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</fieldset>

{% endblock %}
