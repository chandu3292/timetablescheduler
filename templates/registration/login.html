{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ANITS Timetable Scheduler</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.7) 100%), url("{% static 'img/loginbg.jpg' %}") center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-icon-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        input.form-control {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            outline: none;
            transition: all 0.2s;
        }
        input.form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="glass-effect rounded-2xl overflow-hidden flex flex-col md:flex-row w-full">
            
            <!-- Left Side (Logo & Branding) -->
            <div class="w-full md:w-1/2 bg-blue-50 flex flex-col items-center justify-center p-8 border-b md:border-b-0 md:border-r border-gray-200">
                <a href="https://anits.org/" target="_blank" class="transform hover:scale-105 transition-transform duration-300">
                    <img src="{% static 'img/logo.jpg' %}" alt="ANITS Logo" class="h-auto max-h-32 mb-6 rounded shadow-md">
                </a>
                <h2 class="text-2xl font-bold text-gray-800 text-center mb-2">Welcome to</h2>
                <h1 class="text-3xl font-extrabold text-blue-800 text-center tracking-wide">ANITS</h1>
                <p class="text-gray-600 mt-4 text-center font-medium">Timetable Scheduler System</p>
            </div>

            <!-- Right Side (Login Form) -->
            <div class="w-full md:w-1/2 p-8 sm:p-12 bg-white">
                <div class="mb-8 text-center md:text-left">
                    <h3 class="text-3xl font-bold text-gray-800">Sign In</h3>
                    <p class="text-gray-500 mt-2">Access your dashboard</p>
                </div>

                <form method="post" class="space-y-6 w-full">
                    {% csrf_token %}
                    
                    <div class="space-y-1">
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <div class="input-icon-wrapper">
                            <i class="fa fa-user input-icon"></i>
                            {{ form.username }}
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="input-icon-wrapper">
                            <i class="fa fa-lock input-icon"></i>
                            {{ form.password }}
                        </div>
                        {% if form.errors %}
                            <p class="text-red-500 text-sm mt-2"><i class="fa fa-exclamation-circle mr-1"></i>Invalid User Name Or Password.</p>
                        {% endif %}
                    </div>

                    <button type="submit" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
                        <i class="fa fa-sign-in-alt mr-2"></i> Login to Scheduler
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Ensure form elements get the correct class -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                if (input.type !== 'hidden') {
                    input.classList.add('form-control');
                }
            });
        });
    </script>
</body>
</html>
