{% extends 'base.html' %}
{% block content %}
{% load static %}

<form method="post">
  {% csrf_token %}
  <fieldset class="fieldset">
    <div class="tablink">
      <h1>Add Lab Room</h1>
      <a href="{% url 'labRoomEdit' %}">
        <h1>Edit Lab Rooms</h1>
      </a>
    </div>

    <div class="tabcontent">
      {{ form.as_p }}
      <input type="submit" value="Submit" class="submit">
    </div>
  </fieldset>
</form>

{% endblock %}
