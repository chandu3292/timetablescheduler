{% extends 'base.html' %}
{% block content %}
{% load static %}




<fieldset class="fieldset">
  <div class="tablink">
    <a href="{% url 'meetingTimeAdd'%}">
      <h1 onclick="openPage('new')" id="defaultOpen">Add Period Timings</h1>
    </a>
    <h1 onclick="openPage('edit')" id="link_to_edit">Edit Period Timings</h1>
  </div>
  <div class="tabcontent" id="edit">
    <table class="editTable">
      <thead>
        <tr class="table-headers">
          <th>Year</th>
          <th>Day</th>
          <th>Timing</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for mt in meeting_times %}
        <tr>
          <td>{{mt.year.year_name}}</td>
          <td>{{mt.day}}</td>
          <td>{{mt.time}}</td>
          <td>
            <form action="{% url 'deletemeetingtime' mt.pid %}" method="post" style="margin: 0;">
              {% csrf_token %}
              <input type="submit" value="🗑️ Delete" class="cross" 
                     style="background: #f44336; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500;"
                     onclick="return confirm('Are you sure you want to delete this period timing?');">
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</fieldset>

{% endblock %}
