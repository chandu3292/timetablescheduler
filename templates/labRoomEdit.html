{% extends 'base.html' %}
{% block content %}
{% load static %}

<div style="margin-bottom:20px;">
  <a href="{% url 'lab_timetable' %}" class="btn">View Lab Timetable</a>
</div>

<fieldset class="fieldset">
  <h1>Lab Rooms</h1>

  <table class="editTable">
    <thead>
      <tr>
        <th>Lab Name</th>
        <th>Capacity</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      {% for lab in labs %}
      <tr>
        <td>{{ lab.lab_name }}</td>
        <td>{{ lab.seating_capacity }}</td>
        <td>
          <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="{% url 'labRoomUpdate' lab.id %}" 
               style="background: #2196F3; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; display: inline-block; font-size: 14px; font-weight: 500;">
              ✏️ Edit
            </a>
            <form action="{% url 'labRoomDelete' lab.id %}" method="post" style="margin: 0;">
              {% csrf_token %}
              <input type="submit" value="🗑️ Delete" class="cross" 
                     style="background: #f44336; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500;"
                     onclick="return confirm('Are you sure you want to delete {{ lab.lab_name }}?');">
            </form>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</fieldset>

{% endblock %}
